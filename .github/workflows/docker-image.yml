name: Build Container

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ inputs.tag }}
          path: release-assets
      - name: Prepare bundled WebUI and image names
        shell: bash
        run: |
          unzip -q "release-assets/AstrBot-${RELEASE_TAG}-dashboard.zip" -d release-assets/unpacked
          mkdir -p astrbot/dashboard/dist
          cp -a release-assets/unpacked/dist/. astrbot/dashboard/dist/
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE_NAME=$image" >> "$GITHUB_ENV"
          echo "IMAGE_TAGS<<EOF" >> "$GITHUB_ENV"
          echo "$image:${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          if [[ "$RELEASE_TAG" != *-* ]]; then echo "$image:latest" >> "$GITHUB_ENV"; fi
          echo "EOF" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_TAGS }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.tag }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          cache-from: type=gha
          cache-to: type=gha,mode=max
