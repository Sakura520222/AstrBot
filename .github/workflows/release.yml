name: Release AstrBot Fork

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example v4.29.3'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate release version
        id: version
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import os
          import re
          import tomllib
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v\d+\.\d+\.\d+(?:-(?:alpha|beta|rc)\.\d+)?', tag):
              raise SystemExit('Invalid release tag')
          version = tag.removeprefix('v')
          project = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          tree = ast.parse(Path('astrbot/__init__.py').read_text())
          package = next(ast.literal_eval(node.value) for node in tree.body if isinstance(node, ast.Assign) and any(isinstance(target, ast.Name) and target.id == '__version__' for target in node.targets))
          if project != version or package != version:
              raise SystemExit(f'Tag, project and package versions disagree: {tag}, {project}, {package}')
          if not Path(f'changelogs/{tag}.md').is_file():
              raise SystemExit('A reviewed release changelog is required')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\n')
          PY
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.28.2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - name: Build and verify WebUI
        working-directory: dashboard
        run: |
          pnpm install --frozen-lockfile
          pnpm run i18n:check
          node --test tests/*.test.mjs
          pnpm build
          echo "$RELEASE_TAG" > dist/assets/version
      - name: Build source and WebUI archives
        shell: bash
        run: |
          mkdir -p release-assets
          git archive --format=zip --prefix="AstrBot-${RELEASE_TAG}/" --output="release-assets/AstrBot-${RELEASE_TAG}-core.zip" HEAD
          (cd dashboard && zip -qr "../release-assets/AstrBot-${RELEASE_TAG}-dashboard.zip" dist)
          mkdir -p astrbot/dashboard/dist
          cp -a dashboard/dist/. astrbot/dashboard/dist/
      - name: Build Python distributions
        run: |
          python -m pip install uv
          uv build --out-dir release-assets
      - name: Verify packages and write checksums
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import os
          import zipfile
          from pathlib import Path
          assets = Path('release-assets')
          wheel = next(assets.glob('*.whl'))
          with zipfile.ZipFile(wheel) as archive:
              assert 'astrbot/dashboard/dist/index.html' in archive.namelist()
              assert archive.read('astrbot/dashboard/dist/assets/version').decode().strip() == os.environ['RELEASE_TAG']
          core = assets / f"AstrBot-{os.environ['RELEASE_TAG']}-core.zip"
          with zipfile.ZipFile(core) as archive:
              assert not any(name.split('/', 1)[-1].split('/', 1)[0] in {'data', '.venv', '.codegraph', '.env'} for name in archive.namelist())
          lines = [f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}' for path in sorted(assets.iterdir()) if path.is_file()]
          (assets / 'SHA256SUMS').write_text('\n'.join(lines) + '\n')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.version.outputs.tag }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "AstrBot 个人 Fork ${RELEASE_TAG}" --notes-file "changelogs/${RELEASE_TAG}.md"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi

  docker:
    needs: release
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-image.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
