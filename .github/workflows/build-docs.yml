name: Website and Docs CI

on:
  push:
    branches: [master]
    paths: ['docs/**', 'site/**', 'scripts/build_site.mjs', 'scripts/check_site_links.py', '.github/workflows/build-docs.yml']
  pull_request:
    paths: ['docs/**', 'site/**', 'scripts/build_site.mjs', 'scripts/check_site_links.py', '.github/workflows/build-docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.28.2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: Build Chinese documentation
        working-directory: docs
        run: |
          pnpm install --frozen-lockfile
          pnpm docs:build
      - name: Stage unified website
        run: node scripts/build_site.mjs
      - name: Generate public release feed
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > release-pages.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import quote

          pages = json.loads(Path('release-pages.json').read_text(encoding='utf-8'))
          feed = []
          for page in pages:
              for release in page:
                  if release['draft']:
                      continue
                  tag = release['tag_name']
                  feed.append({
                      'name': release.get('name') or tag,
                      'tag_name': tag,
                      'published_at': release['published_at'],
                      'body': release.get('body') or '',
                      'zipball_url': f"https://github.com/{os.environ['GH_REPO']}/archive/refs/tags/{quote(tag, safe='')}.zip",
                      'prerelease': release['prerelease'],
                  })
          Path('site-dist/releases.json').write_text(json.dumps(feed, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
      - name: Check website entry files
        run: |
          test -s site/index.html
          test -s site/styles.css
          test -s site/favicon.svg
          python scripts/check_site_links.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site-dist
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://astrbot.pyabunny.com
    steps:
      - name: Deploy website to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
