name: Website and Docs CI

on:
  push:
    branches: [master]
    paths: ['docs/**', 'site/**', 'scripts/build_site.mjs', '.github/workflows/build-docs.yml']
  pull_request:
    paths: ['docs/**', 'site/**', 'scripts/build_site.mjs', '.github/workflows/build-docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.28.2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: Build Chinese documentation
        working-directory: docs
        run: |
          pnpm install --frozen-lockfile
          pnpm docs:build
      - name: Stage unified website
        run: node scripts/build_site.mjs
      - name: Check website entry files
        run: |
          test -s site/index.html
          test -s site/styles.css
          test -s site/favicon.svg
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site-dist
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
